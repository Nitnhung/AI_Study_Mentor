# ── Server ───────────────────────────────────────────────
server.port=8080

# ── MySQL (XAMPP) ────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mentor_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──────────────────────────────────────────────────
jwt.secret=AI_Study_Mentor_BrightPath_Learning_SecretKey_2024_Unit22
jwt.expiration-ms=86400000

# ── Gemini AI ────────────────────────────────────────────
gemini.api-key=YOUR_API_KEY_HERE
gemini.model=gemini-3.5-flash
gemini.vision-model=gemini-3.5-flash
gemini.timeout-seconds=45
gemini.max-output-tokens=4096

# ── CORS (cho Flutter) ──────────────────────────────────
cors.allowed-origins=*
